<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Gráficos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Tema Escuro */
            --screen-bg: linear-gradient(135deg, #0a0a0b 0%, #1a1a1d 100%);
            --page-bg: #16171a;
            --card-bg: rgba(44, 44, 46, 0.8);
            --input-bg: rgba(58, 59, 63, 0.6);
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --accent-blue: #0A84FF;
            --border-color: rgba(58, 59, 63, 0.3);
            --shadow-light: rgba(0, 0, 0, 0.1);
            --shadow-medium: rgba(0, 0, 0, 0.2);
        }

        html.light {
            /* Tema Claro */
            --screen-bg: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --page-bg: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.9);
            --input-bg: rgba(229, 229, 234, 0.6);
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --accent-blue: #007AFF;
            --border-color: rgba(229, 229, 234, 0.5);
            --shadow-light: rgba(0, 0, 0, 0.05);
            --shadow-medium: rgba(0, 0, 0, 0.1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--screen-bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .screen-page {
            width: 100%;
            min-height: 100vh;
            padding: min(5vh, 40px) clamp(16px, 4vw, 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-content-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        .graphs-header {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: clamp(24px, 4vh, 40px);
            gap: 16px;
        }

        .back-btn {
            background: var(--card-bg);
            color: var(--text-primary);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow-light);
            flex-shrink: 0;
        }
        .back-btn:hover {
            transform: scale(1.05);
        }

        .graphs-title {
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: 700;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: clamp(24px, 4vh, 40px);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .filter-bar::-webkit-scrollbar {
             display: none;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .charts-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(24px, 4vw, 32px);
        }

        .chart-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: clamp(16px, 3vw, 24px);
            box-shadow: 0 8px 32px var(--shadow-light);
            transition: all 0.3s ease;
            user-select: none;
        }
        .chart-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--shadow-medium);
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .chart-title-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chart-title-section h3 {
            font-size: clamp(1.1rem, 3vw, 1.25rem);
            font-weight: 600;
        }

        .carousel-nav {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: auto;
        }

        .nav-btn {
            background: var(--input-bg);
            border: none;
            border-radius: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .nav-btn:hover {
            background: var(--accent-blue);
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            background: var(--input-bg);
            color: var(--text-secondary);
        }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
            transition: opacity 0.2s ease-in-out;
        }
        .chart-container.is-changing {
            opacity: 0;
        }

        .chart-indicators {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-top: 12px;
        }

        .indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            opacity: 0.3;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .indicator.active {
            background: var(--accent-blue);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="graphs-screen" class="screen-page">
         <div class="page-content-wrapper">
              <div class="graphs-header">
                  <button id="back-to-home-btn" class="back-btn" aria-label="Voltar">
                      <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
                  </button>
                  <h1 class="graphs-title">Desempenho</h1>
              </div>

              <div class="filter-bar">
                  <button class="filter-btn active" data-period="7d">7 dias</button>
                  <button class="filter-btn" data-period="30d">Este Mês</button>
                  <button class="filter-btn" data-period="365d">Este Ano</button>
              </div>

              <div id="charts-grid" class="charts-grid">
                  <!-- Gráficos serão renderizados aqui -->
              </div>
         </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const state = {
                charts: {},
                currentGraphPeriod: '7d',
                currentMetrics: {},
                theme: 'dark'
            };

            const appData = [
                { id: 'financeiro', name: 'Financeiro', icon: 'landmark', color: '#25D366', metrics: [{ id: 'economia', name: 'Economia (R$)', unit: 'R$', type: 'line' }, { id: 'gastos', name: 'Gastos (R$)', unit: 'R$', type: 'bar' }, { id: 'investimentos', name: 'Investimentos (R$)', unit: 'R$', type: 'line' }, { id: 'receita', name: 'Receita (R$)', unit: 'R$', type: 'bar' }] },
                { id: 'rotina', name: 'Rotina', icon: 'repeat', color: '#007aff', metrics: [{ id: 'horas_sono', name: 'Horas de Sono', unit: 'h', type: 'line' }, { id: 'produtividade', name: 'Produtividade (%)', unit: '%', type: 'bar' }, { id: 'habitos', name: 'Hábitos Cumpridos', unit: '', type: 'bar' }, { id: 'humor', name: 'Índice de Humor', unit: '/10', type: 'line' }] },
                { id: 'trabalho', name: 'Trabalho', icon: 'briefcase', color: '#af52de', metrics: [{ id: 'horas_trabalhadas', name: 'Horas Trabalhadas', unit: 'h', type: 'bar' }, { id: 'tarefas_concluidas', name: 'Tarefas Concluídas', unit: '', type: 'bar' }, { id: 'eficiencia', name: 'Eficiência (%)', unit: '%', type: 'line' }, { id: 'reunioes', name: 'Reuniões', unit: '', type: 'bar' }] },
                { id: 'estudos', name: 'Estudos', icon: 'book-open', color: '#ff9500', metrics: [{ id: 'horas_estudo', name: 'Horas de Estudo', unit: 'h', type: 'bar' }, { id: 'materias', name: 'Matérias Estudadas', unit: '', type: 'bar' }, { id: 'aproveitamento', name: 'Aproveitamento (%)', unit: '%', type: 'line' }, { id: 'exercicios', name: 'Exercícios Feitos', unit: '', type: 'bar' }] },
                { id: 'academia', name: 'Academia', icon: 'dumbbell', color: '#ff2d55', metrics: [{ id: 'peso', name: 'Peso Corporal (kg)', unit: 'kg', type: 'line' }, { id: 'carga_maxima', name: 'Carga Máxima (kg)', unit: 'kg', type: 'line' }, { id: 'treinos', name: 'Treinos Realizados', unit: '', type: 'bar' }, { id: 'tempo_treino', name: 'Tempo de Treino (min)', unit: 'min', type: 'bar' }] },
                { id: 'alimentacao', name: 'Alimentação', icon: 'leaf', color: '#30d158', metrics: [{ id: 'calorias', name: 'Calorias Consumidas', unit: 'kcal', type: 'bar' }, { id: 'agua', name: 'Água Consumida (L)', unit: 'L', type: 'bar' }, { id: 'proteinas', name: 'Proteínas (g)', unit: 'g', type: 'bar' }, { id: 'qualidade', name: 'Qualidade da Dieta (%)', unit: '%', type: 'line' }] }
            ];

            appData.forEach(app => { state.currentMetrics[app.id] = 0; });

            const generateChartData = (period, metricId) => {
                let labels, data;
                const baseValues = { 'economia': [500, 700, 650, 800, 900, 1200, 1100], 'gastos': [1200, 1100, 1300, 1000, 1150, 1400, 1250], 'investimentos': [2000, 2100, 2050, 2200, 2300, 2400, 2500], 'receita': [3000, 3200, 3100, 3400, 3300, 3500, 3600], 'horas_sono': [7, 6.5, 8, 7.5, 6, 8.5, 7], 'produtividade': [85, 78, 90, 87, 82, 95, 89], 'habitos': [8, 7, 9, 8, 6, 10, 9], 'humor': [7.5, 6.8, 8.2, 7.9, 6.5, 8.8, 8.1], 'horas_trabalhadas': [8, 7.5, 8.5, 8, 7, 9, 8.5], 'tarefas_concluidas': [12, 10, 15, 13, 9, 16, 14], 'eficiencia': [88, 82, 92, 85, 79, 95, 90], 'reunioes': [3, 2, 4, 3, 1, 5, 3], 'horas_estudo': [4, 3.5, 5, 4.5, 3, 6, 4], 'materias': [3, 2, 4, 3, 2, 5, 3], 'aproveitamento': [82, 78, 88, 85, 75, 92, 86], 'exercicios': [15, 12, 18, 16, 10, 20, 17], 'peso': [72.5, 72.3, 72.1, 71.8, 71.6, 71.4, 71.2], 'carga_maxima': [80, 82, 85, 87, 90, 92, 95], 'treinos': [4, 3, 5, 4, 3, 5, 4], 'tempo_treino': [45, 40, 50, 48, 35, 55, 50], 'calorias': [1800, 1950, 1750, 2000, 1900, 2100, 1850], 'agua': [2.1, 1.8, 2.5, 2.2, 1.7, 2.8, 2.3], 'proteinas': [120, 110, 135, 128, 105, 140, 125], 'qualidade': [85, 78, 90, 82, 75, 92, 88] };
                switch (period) {
                    case '30d': labels = ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4']; data = baseValues[metricId] ? baseValues[metricId].slice(0, 4).map(v => v + (Math.random() - 0.5) * v * 0.1) : [0, 0, 0, 0]; break;
                    case '365d': labels = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez']; const baseVal = baseValues[metricId] ? baseValues[metricId][0] : 0; data = Array.from({length: 12}, (_, i) => baseVal + (Math.random() - 0.5) * baseVal * 0.2 + i * baseVal * 0.02); break;
                    default: labels = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom']; data = baseValues[metricId] || Array.from({length: 7}, () => Math.random() * 100); break;
                }
                return { labels, data: data.map(d => parseFloat(d.toFixed(2))) };
            };

            const renderCharts = () => {
                const chartsGrid = document.getElementById('charts-grid');
                chartsGrid.innerHTML = '';
                Object.values(state.charts).forEach(chart => chart.destroy()); state.charts = {};
                const fragment = document.createDocumentFragment();
                appData.forEach(app => {
                    const currentMetricIndex = state.currentMetrics[app.id]; const currentMetric = app.metrics[currentMetricIndex];
                    const card = document.createElement('div'); card.className = 'chart-card'; card.dataset.appId = app.id;
                    card.innerHTML = `<div class="chart-header"><div class="chart-title-section"><i data-lucide="${app.icon}" style="width: 24px; height: 24px; color: ${app.color};"></i><h3>${app.name}</h3></div><div class="carousel-nav"><button class="nav-btn prev-btn" data-app="${app.id}"><i data-lucide="chevron-left" style="width: 12px; height: 12px;"></i></button><button class="nav-btn next-btn" data-app="${app.id}"><i data-lucide="chevron-right" style="width: 12px; height: 12px;"></i></button></div></div><div style="text-align: center; margin-bottom: 12px;"><span class="metric-name" style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 500;">${currentMetric.name}</span></div><div class="chart-container"><canvas id="chart-${app.id}"></canvas></div><div class="chart-indicators">${app.metrics.map((_, index) => `<div class="indicator ${index === currentMetricIndex ? 'active' : ''}" data-app="${app.id}" data-metric="${index}"></div>`).join('')}</div>`;
                    fragment.appendChild(card);
                });
                chartsGrid.appendChild(fragment);

                appData.forEach(app => {
                    const ctx = document.getElementById(`chart-${app.id}`).getContext('2d'); const currentMetricIndex = state.currentMetrics[app.id]; const currentMetric = app.metrics[currentMetricIndex]; const chartData = generateChartData(state.currentGraphPeriod, currentMetric.id, app.id); const isDark = state.theme === 'dark'; const gridColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)'; const textColor = isDark ? '#a0a0a0' : '#6e6e73';
                    state.charts[app.id] = new Chart(ctx, { type: currentMetric.type, data: { labels: chartData.labels, datasets: [{ label: currentMetric.name, data: chartData.data, backgroundColor: currentMetric.type === 'line' ? 'transparent' : `${app.color}99`, borderColor: app.color, borderWidth: 2, borderRadius: currentMetric.type === 'bar' ? 8 : 0, barThickness: currentMetric.type === 'bar' ? 'flex' : undefined, maxBarThickness: currentMetric.type === 'bar' ? 30 : undefined, fill: currentMetric.type === 'line', tension: currentMetric.type === 'line' ? 0.4 : 0, pointBackgroundColor: currentMetric.type === 'line' ? app.color : undefined, pointBorderColor: currentMetric.type === 'line' ? app.color : undefined, pointRadius: currentMetric.type === 'line' ? 4 : 0, pointHoverRadius: currentMetric.type === 'line' ? 6 : 0, }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: currentMetric.type === 'bar', grid: { color: gridColor }, ticks: { color: textColor, callback: function(value) { return value + (currentMetric.unit || ''); } } }, x: { grid: { display: false }, ticks: { color: textColor } } }, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'var(--card-bg)', titleColor: 'var(--text-primary)', bodyColor: 'var(--text-secondary)', borderColor: 'var(--border-color)', borderWidth: 1, padding: 10, cornerRadius: 12, callbacks: { label: function(context) { return `${context.parsed.y}${currentMetric.unit || ''}`; } } } } } });
                });
                lucide.createIcons();
            };

            const updateSingleCard = (appId) => {
                const chart = state.charts[appId];
                if (!chart) return;

                const app = appData.find(a => a.id === appId);
                const currentMetricIndex = state.currentMetrics[appId];
                const currentMetric = app.metrics[currentMetricIndex];
                const chartData = generateChartData(state.currentGraphPeriod, currentMetric.id);

                // Update Chart Data & Type
                chart.config.type = currentMetric.type;
                chart.data.labels = chartData.labels;
                const dataset = chart.data.datasets[0];
                dataset.label = currentMetric.name;
                dataset.data = chartData.data;
                dataset.backgroundColor = currentMetric.type === 'line' ? 'transparent' : `${app.color}99`;
                dataset.borderColor = app.color;
                dataset.fill = currentMetric.type === 'line';
                dataset.tension = currentMetric.type === 'line' ? 0.4 : 0;
                chart.options.scales.y.beginAtZero = currentMetric.type === 'bar';
                chart.update();

                // Update UI elements
                const card = document.querySelector(`.chart-card[data-app-id="${appId}"]`);
                if(card) {
                    card.querySelector('.metric-name').textContent = currentMetric.name;
                    const indicators = card.querySelectorAll('.indicator');
                    indicators.forEach((indicator, index) => {
                        indicator.classList.toggle('active', index === currentMetricIndex);
                    });
                }
            };

            const changeMetric = (appId, newIndex) => {
                 const card = document.querySelector(`.chart-card[data-app-id="${appId}"]`);
                if (!card) return;

                const chartContainer = card.querySelector('.chart-container');
                chartContainer.classList.add('is-changing');

                setTimeout(() => {
                    state.currentMetrics[appId] = newIndex;
                    updateSingleCard(appId);
                    chartContainer.classList.remove('is-changing');
                }, 200);
            };

            const navigateMetric = (appId, direction) => {
                const app = appData.find(a => a.id === appId); if (!app) return;
                const currentIndex = state.currentMetrics[appId];
                const newIndex = direction === 'next' ? (currentIndex + 1) % app.metrics.length : (currentIndex === 0 ? app.metrics.length - 1 : currentIndex - 1);
                changeMetric(appId, newIndex);
            };

            const setMetric = (appId, metricIndex) => {
                if (state.currentMetrics[appId] === metricIndex) return;
                changeMetric(appId, metricIndex);
            };

            const updateChartsPeriod = (newPeriod) => {
                if (state.currentGraphPeriod === newPeriod) return; state.currentGraphPeriod = newPeriod;
                const filterBar = document.querySelector('.filter-bar');
                filterBar.querySelector('.active').classList.remove('active');
                filterBar.querySelector(`[data-period="${newPeriod}"]`).classList.add('active');
                appData.forEach(app => updateSingleCard(app.id));
            };

            // Event Listeners
            document.querySelector('.filter-bar').addEventListener('click', e => { if(e.target.classList.contains('filter-btn')) { updateChartsPeriod(e.target.dataset.period); } });
            document.getElementById('charts-grid').addEventListener('click', e => { const nextBtn = e.target.closest('.next-btn'); const prevBtn = e.target.closest('.prev-btn'); const indicator = e.target.closest('.indicator'); if (nextBtn) { navigateMetric(nextBtn.dataset.app, 'next'); } else if (prevBtn) { navigateMetric(prevBtn.dataset.app, 'prev'); } else if (indicator) { setMetric(indicator.dataset.app, parseInt(indicator.dataset.metric)); } });


            // --- Card Swipe Functionality ---
            let cardTouchStartX = 0, swipedAppId = null; const swipeThreshold = 50;

            const handleSwipeStart = e => {
                const targetCard = e.target.closest('.chart-card'); if (!targetCard) return;
                swipedAppId = targetCard.dataset.appId;
                cardTouchStartX = e.type.includes('mouse') ? e.pageX : e.changedTouches[0].screenX;
            };

            const handleSwipeEnd = e => {
                if (!swipedAppId) return;
                const cardTouchEndX = e.type.includes('mouse') ? e.pageX : e.changedTouches[0].screenX;
                const deltaX = cardTouchEndX - cardTouchStartX;
                if (Math.abs(deltaX) > swipeThreshold) {
                    navigateMetric(swipedAppId, deltaX < 0 ? 'next' : 'prev');
                }
                swipedAppId = null;
            };

            const chartsGrid = document.getElementById('charts-grid');
            chartsGrid.addEventListener('mousedown', handleSwipeStart);
            chartsGrid.addEventListener('mouseup', handleSwipeEnd);
            chartsGrid.addEventListener('touchstart', handleSwipeStart, { passive: true });
            chartsGrid.addEventListener('touchend', handleSwipeEnd, { passive: true });

            // Initialize
            renderCharts();
        });
    </script>
</body>
</html>
